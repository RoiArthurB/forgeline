# What the app asks GitHub's GraphQL API of a repository, checked against schema.graphqls when it builds. Queries put
# together at run time (one alias per repository asked at once) are written in Kotlin instead.

query Viewer($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    viewerHasStarred
    viewerSubscription
  }
}

query Pinned($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    pinnedIssues(first: 3) {
      nodes {
        issue {
          number
          title
          state
          createdAt
          author {
            login
            avatarUrl
          }
          comments {
            totalCount
          }
          labels(first: 10) {
            nodes {
              name
              color
            }
          }
        }
      }
    }
  }
}

query Discussions($owner: String!, $name: String!, $after: String) {
  repository(owner: $owner, name: $name) {
    discussions(first: 30, after: $after, orderBy: {field: UPDATED_AT, direction: DESC}) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        ...DiscussionFields
        comments {
          totalCount
        }
      }
    }
  }
}

# Up to 50 comments, and 30 replies to each: the forge's site has the rest.
query Discussion($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    discussion(number: $number) {
      ...DiscussionFields
      id
      locked
      body
      viewerHasUpvoted
      viewerCanUpvote
      viewerCanUpdate
      viewerCanDelete
      viewerSubscription
      viewerCanSubscribe
      ...ReactionTally
      comments(first: 50) {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...DiscussionCommentWithReplies
        }
      }
    }
  }
}

fragment DiscussionCommentWithReplies on DiscussionComment {
  ...DiscussionCommentFields
  replies(first: 30) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...DiscussionCommentFields
    }
  }
}

query DiscussionComments($id: ID!, $after: String) {
  node(id: $id) {
    ... on Discussion {
      comments(first: 50, after: $after) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...DiscussionCommentWithReplies
        }
      }
    }
  }
}

query DiscussionReplies($id: ID!, $after: String) {
  node(id: $id) {
    ... on DiscussionComment {
      replies(first: 50, after: $after) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...DiscussionCommentFields
        }
      }
    }
  }
}

fragment DiscussionFields on Discussion {
  number
  title
  createdAt
  upvoteCount
  isAnswered
  category {
    name
  }
  author {
    login
    avatarUrl
  }
}

fragment DiscussionCommentFields on DiscussionComment {
  id
  body
  createdAt
  upvoteCount
  isAnswer
  viewerCanMarkAsAnswer
  viewerCanUnmarkAsAnswer
  viewerHasUpvoted
  viewerCanUpvote
  viewerCanUpdate
  viewerCanDelete
  author {
    login
    avatarUrl
  }
  ...ReactionTally
}

# Every kind is listed, most at zero.
fragment ReactionTally on Reactable {
  viewerCanReact
  reactionGroups {
    content
    viewerHasReacted
    reactors {
      totalCount
    }
  }
}

mutation UpdateDiscussionComment($id: ID!, $body: String!) {
  updateDiscussionComment(input: {commentId: $id, body: $body}) {
    comment {
      id
    }
  }
}

mutation DeleteDiscussionComment($id: ID!) {
  deleteDiscussionComment(input: {id: $id}) {
    comment {
      id
    }
  }
}

mutation UpdateDiscussion($id: ID!, $title: String!, $body: String!) {
  updateDiscussion(input: {discussionId: $id, title: $title, body: $body}) {
    discussion {
      id
    }
  }
}

mutation DeleteDiscussion($id: ID!) {
  deleteDiscussion(input: {id: $id}) {
    discussion {
      id
    }
  }
}

mutation AddUpvote($id: ID!) {
  addUpvote(input: {subjectId: $id}) {
    subject {
      ...VoteTally
    }
  }
}

mutation RemoveUpvote($id: ID!) {
  removeUpvote(input: {subjectId: $id}) {
    subject {
      ...VoteTally
    }
  }
}

fragment VoteTally on Votable {
  upvoteCount
  viewerHasUpvoted
  viewerCanUpvote
}

mutation AddReaction($id: ID!, $content: ReactionContent!) {
  addReaction(input: {subjectId: $id, content: $content}) {
    subject {
      ...ReactionTally
    }
  }
}

mutation RemoveReaction($id: ID!, $content: ReactionContent!) {
  removeReaction(input: {subjectId: $id, content: $content}) {
    subject {
      ...ReactionTally
    }
  }
}

mutation AddDiscussionComment($discussion: ID!, $body: String!, $replyTo: ID) {
  addDiscussionComment(input: {discussionId: $discussion, body: $body, replyToId: $replyTo}) {
    comment {
      id
    }
  }
}

mutation MarkDiscussionAnswer($id: ID!) {
  markDiscussionCommentAsAnswer(input: {id: $id}) {
    clientMutationId
  }
}

mutation UnmarkDiscussionAnswer($id: ID!) {
  unmarkDiscussionCommentAsAnswer(input: {id: $id}) {
    clientMutationId
  }
}
