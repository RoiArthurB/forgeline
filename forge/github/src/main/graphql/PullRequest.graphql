# What the app asks GitHub's GraphQL API of a pull request, checked against schema.graphqls when it builds.

mutation Revert($id: ID!) {
  revertPullRequest(input: {pullRequestId: $id}) {
    revertPullRequest {
      number
    }
  }
}

mutation EnableAutoMerge($id: ID!, $method: PullRequestMergeMethod!) {
  enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: $method}) {
    clientMutationId
  }
}

# Whether the reviews a rule needs are in, and where the last commit's checks stand.
query Standing($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      reviewDecision
      commits(last: 1) {
        nodes {
          commit {
            statusCheckRollup {
              state
            }
          }
        }
      }
    }
  }
}

query Threads($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      reviewThreads(first: 100) {
        nodes {
          id
          isResolved
          isOutdated
          path
          line
          originalLine
          startLine
          diffSide
          viewerCanResolve
          viewerCanUnresolve
          comments(first: 100) {
            nodes {
              # databaseId is 32-bit and these ids are past it.
              fullDatabaseId
              body
              createdAt
              diffHunk
              author {
                login
                avatarUrl
              }
              reactionGroups {
                content
                reactors {
                  totalCount
                }
              }
            }
          }
        }
      }
    }
  }
}

mutation ResolveThread($id: ID!) {
  resolveReviewThread(input: {threadId: $id}) {
    thread {
      id
    }
  }
}

mutation UnresolveThread($id: ID!) {
  unresolveReviewThread(input: {threadId: $id}) {
    thread {
      id
    }
  }
}

# A hundred files a page, with whether the reader viewed each.
query Viewed($owner: String!, $name: String!, $number: Int!, $after: String) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      id
      files(first: 100, after: $after) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          path
          viewerViewedState
        }
      }
    }
  }
}

mutation MarkFileViewed($id: ID!, $path: String!) {
  markFileAsViewed(input: {pullRequestId: $id, path: $path}) {
    clientMutationId
  }
}

mutation UnmarkFileViewed($id: ID!, $path: String!) {
  unmarkFileAsViewed(input: {pullRequestId: $id, path: $path}) {
    clientMutationId
  }
}

query Blame($owner: String!, $name: String!, $ref: String!, $path: String!) {
  repository(owner: $owner, name: $name) {
    target: object(expression: $ref) {
      ... on Commit {
        blame(path: $path) {
          ranges {
            startingLine
            endingLine
            commit {
              oid
              message
              authoredDate
              author {
                name
                user {
                  login
                  avatarUrl
                }
              }
            }
          }
        }
      }
    }
  }
}

mutation DisableAutoMerge($id: ID!) {
  disablePullRequestAutoMerge(input: {pullRequestId: $id}) {
    clientMutationId
  }
}

# GitHub reads them from the default branch itself, wherever they are kept (the root, `.github`, `docs`).
query PullRequestTemplates($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    pullRequestTemplates {
      filename
      body
    }
  }
}
