name: Trending

# Codeberg and gitlab.com have no trending page, so this measures one for each, for everyone, once a
# day, with anonymous requests, and publishes them on GitHub Pages alongside the static landing page in
# site/: <forge>/trending.json for the app, <forge>/state.json for tomorrow's run. Pushing changes under
# site/ republishes the landing page while keeping each forge's existing state.json and trending.json;
# so does a release, through the republish input, so the page names the new version.
# See docs/CODEBERG.md#trending and docs/GITLAB.md#trending.
on:
  workflow_dispatch:
    inputs:
      republish:
        description: "Republish the landing page with yesterday's trending files, without measuring"
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/trending.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Two runs at once would both build on the same yesterday and one would lose its day.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      REPUBLISH: ${{ github.event_name == 'push' || inputs.republish == true }}
    steps:
      - uses: actions/checkout@v7
      - if: env.REPUBLISH != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - if: env.REPUBLISH != 'true'
        uses: gradle/actions/setup-gradle@v6
      - id: pages
        uses: actions/configure-pages@v6
      - name: Measure
        # Both forges and the landing page in site/ go out in one Pages deployment, which replaces the
        # whole site. So each forge's history is read first: only a 404 (that forge's very first run)
        # starts afresh, and any other failure stops here, since publishing without it would throw away a
        # month of measurements. On a push to site/ or a release, yesterday's files are kept as-is without
        # crawling the forges again. On a scheduled or manual run, a forge that can't be measured today publishes
        # yesterday's files again, so the other forge's day isn't lost; with nothing measured at all,
        # nothing is published.
        run: |
          measured=0
          for forge in codeberg gitlab; do
            echo "::group::$forge"
            base="${{ steps.pages.outputs.base_url }}/$forge"
            status=$(curl -sSL --retry 3 -o "previous-$forge.json" -w '%{http_code}' "$base/state.json")
            case "$status" in
              200) echo "History found." ;;
              404) echo "No history yet: starting afresh."; rm -f "previous-$forge.json" ;;
              *) echo "Couldn't read $forge's history (HTTP $status)."; exit 1 ;;
            esac
            if [ "$REPUBLISH" = "true" ]; then
              if [ -f "previous-$forge.json" ]; then
                mkdir -p "site/$forge"
                cp "previous-$forge.json" "site/$forge/state.json"
                curl -sSfL --retry 3 -o "site/$forge/trending.json" "$base/trending.json"
              fi
              measured=$((measured + 1))
            elif ./gradlew :tools:trending:run --args="$forge $GITHUB_WORKSPACE/previous-$forge.json $GITHUB_WORKSPACE/site/$forge"; then
              measured=$((measured + 1))
            elif [ -f "previous-$forge.json" ]; then
              echo "::warning::Couldn't measure $forge today: publishing yesterday's files again."
              mkdir -p "site/$forge"
              cp "previous-$forge.json" "site/$forge/state.json"
              curl -sSfL --retry 3 -o "site/$forge/trending.json" "$base/trending.json"
            else
              echo "::warning::Couldn't measure $forge, which has no history yet."
              rm -rf "site/$forge"
            fi
            echo "::endgroup::"
          done
          [ "$measured" -gt 0 ]
      - name: Name the latest release
        # The page says which version the download buttons fetch: the latest release, pre-releases aside,
        # as GitHub's releases/latest link does. Every element marked data-version gets its tag.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          sed -i -E "s|(<[^>]* data-version[^>]*>)v[^<]*<|\1$tag<|g" site/index.html
          grep -c "data-version>$tag<" site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
