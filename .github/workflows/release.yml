name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Work out the version from the tag
        # versionName and versionCode, for the build and for F-Droid, which reads version.txt off the latest release.
        run: bash tools/release/version.sh "$GITHUB_REF_NAME" | tee version.txt >> "$GITHUB_ENV"
      - name: Check the release notes
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES is missing: write the release notes before tagging, see docs/RELEASING.md"
            exit 1
          fi
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing, see docs/RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          FORGELINE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          FORGELINE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FORGELINE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FORGELINE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -Pforgeline.versionName="$versionName" \
            -Pforgeline.versionCode="$versionCode"
          cp app/build/outputs/apk/release/app-release.apk "forgeline-$versionName.apk"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            forgeline-*.apk
            version.txt
          # Hand-written: GitHub's generated notes list pull requests, and Forgeline commits straight to main.
          body_path: docs/release-notes/${{ github.ref_name }}.md
      - name: Republish the landing page
        # A release made with this workflow's token doesn't start other workflows, so the landing page is
        # asked for directly, to name the new version.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run trending.yml --repo "$GITHUB_REPOSITORY" --ref main -f republish=true
