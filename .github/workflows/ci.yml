name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: JVM tests, screenshots, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Check
        run: ./gradlew testDebugUnitTest verifyRoborazziDebug lintDebug assembleDebug --continue
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
          retention-days: 7

  emulator:
    name: Emulator tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 32, 33, 34, 35, 36] # From Android 12 to 16
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :core:data:assembleDebugAndroidTest
      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # Automated Test Device image: headless-optimized, no launcher to ANR and steal focus.
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # A stuck test fails after 2 minutes instead of eating the whole job.
          script: |
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb logcat -c
            adb logcat -v time > logcat.txt 2>&1 &
            ./gradlew --continue :app:connectedDebugAndroidTest :core:data:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.timeout_msec=120000
      - name: Upload reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-reports-${{ matrix.api-level }}
          path: |
            */build/reports/androidTests/
            core/*/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            logcat.txt
          retention-days: 7
