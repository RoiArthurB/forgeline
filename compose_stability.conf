// Types the Compose compiler can't see into (they come from modules it doesn't compile, or from the JDK), declared
// stable so a row handed equal data skips instead of redrawing. Every list or screen re-reads its rows from the
// database or the network as new objects; without this, each refresh redrew every visible row, changed or not.
//
// Only immutable types belong here: every property a val, and collections never changed once built.

// Forge data: read-only snapshots, nested classes included (FeedAction.Released...).
fr.arthurbrugiere.forgeline.core.model.**

// Read-only collections: the app builds new ones rather than changing those it has handed out.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map

java.time.Instant
