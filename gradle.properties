org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-detect=false
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
android.nonTransitiveRClass=true

# For local builds only. A release takes both from its tag (tools/release/version.sh), and F-Droid's recipe rewrites
# these two lines with them (docs/DISTRIBUTION.md): nothing to bump here.
forgeline.versionCode=1
forgeline.versionName=0.6.0

# GitHub OAuth App client ID (public). See docs/GITHUB_OAUTH_APP.md.
forgeline.githubClientId=Ov23liSggIQmot0Sb5Hg
forgeline.codebergClientId=91d52e0b-71ff-4f74-9666-4d3b00ad53a9
# gitlab.com's OAuth application (public). Empty: gitlab.com offers access tokens only. See docs/GITLAB_OAUTH_APP.md.
forgeline.gitlabClientId=7a9b7e1c148e005ed5896586fd672194107ac6bb2a2e632cae54be138b397586
# gitea.com's OAuth application (public, redirect http://127.0.0.1/oauth/gitea). Empty: access tokens only. See docs/GITEA.md.
forgeline.giteaClientId=4aec4807-bded-4937-93b6-a323d6403c87

# Where .github/workflows/trending.yml publishes Codeberg's and gitlab.com's Trending (GitHub Pages).
forgeline.codebergTrendingUrl=https://arthurbrugiere.fr/forgeline/codeberg/trending.json
forgeline.gitlabTrendingUrl=https://arthurbrugiere.fr/forgeline/gitlab/trending.json

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
